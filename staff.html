<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="냠냠 직원용"><link rel="apple-touch-icon" href="icon-staff.png"><link rel="icon" href="icon.png"></head><body>
<script>
/* 화면이 안 나올 때 원인을 화면에 보여 줘요 */
(function(){
  function show(msg){
    try {
      var d = document.getElementById("errBox");
      if (!d) { d = document.createElement("div"); d.id = "errBox";
        d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#fff;border:3px solid #E2477E;border-radius:12px;padding:12px 14px;font:15px/1.5 -apple-system,sans-serif;color:#3A2420;white-space:pre-wrap";
        (document.body || document.documentElement).appendChild(d); d.textContent = "오류가 생겼어요. 이 화면을 캡처해서 보내 주세요.\n"; }
      d.textContent += "\n• " + msg;
    } catch(e) {}
  }
  window.addEventListener("error", function(e){ show((e.message || "오류") + " (" + (e.lineno || "?") + "줄)"); });
  window.addEventListener("unhandledrejection", function(e){ show("비동기 오류: " + (e.reason && (e.reason.message || e.reason))); });
  window.__showErr = show;
})();
</script>
<title>냠냠 아이스크림 직원용</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: iPad 가로 화면 기준 3단(상단 가게 이름·단계 / 가운데 선택 / 하단 주문 요약). 키오스크라 밝은 단일 테마로 고정 */
:root{
  color-scheme: light;
  --bg:#FFF6F1;          /* 연한 우유빛 살구 */
  --panel:#FFFFFF;
  --ink:#3A2420;          /* 코코아 갈색 글자 */
  --ink-soft:#7A5E57;
  --brand:#E2477E;        /* 딸기 분홍 */
  --brand-deep:#B92E62;
  --mint:#3FB59A;         /* 결제·완료 */
  --mint-deep:#2A8C76;
  --line:#F0DCD3;
  --cone:#E3A35B; --cone-line:#B9763A;
  --cup:#7FC8F0; --cup-line:#3E93C4;
  --empty:#FBEDE7; --empty-line:#D9A99A;
  --shadow: 0 6px 0 var(--line);
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body);
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--brand);outline-offset:3px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* 상단 */
.top{
  background:var(--brand); color:#fff;
  padding-block:14px; padding-left:max(20px,env(safe-area-inset-left,0px)); padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.shop{font-family:var(--f-display);font-size:clamp(24px,3.4vw,36px);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.shop svg{width:34px;height:42px;flex:none}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{
  font-family:var(--f-display);font-size:clamp(14px,1.7vw,18px);
  padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.18);color:rgba(255,255,255,.8);
  display:flex;align-items:center;gap:6px;
}
.steps li b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);font-weight:400;font-size:.85em}
.steps li.on{background:#fff;color:var(--brand-deep)}
.steps li.on b{background:var(--brand);color:#fff}
.steps li.done{color:#fff}
.steps[hidden]{display:none!important}

/* 가운데 */
.main{overflow:auto;padding-block:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;min-height:0}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;min-height:0;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.q{font-family:var(--f-display);font-size:clamp(28px,4vw,44px);text-align:center;margin:4px 0 0;text-wrap:balance}
.sub{text-align:center;color:var(--ink-soft);font-size:clamp(16px,2vw,21px);margin:-8px 0 0}

/* 큰 선택 카드 */
.choices{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:stretch;max-width:900px;width:100%;margin:0 auto}
.choice{
  background:var(--panel);border:4px solid var(--line);border-radius:28px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;
  transition:transform .12s ease,border-color .12s ease;
}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.choice.sel{border-color:var(--brand)}
.choice svg{width:min(180px,60%);height:auto;max-height:34vh}
.choice .name{font-family:var(--f-display);font-size:clamp(28px,3.6vw,40px)}
.choice .price{font-family:var(--f-display);font-size:clamp(20px,2.4vw,26px);color:var(--brand-deep);font-variant-numeric:tabular-nums}

/* 맛 고르기 */
.flavor-wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,32%);gap:20px;min-height:0}
.flavors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-content:start}
.flavor{
  position:relative;background:var(--panel);border:4px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px 14px;
  transition:transform .12s ease;
}
.flavor:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.flavor svg{width:min(130px,80%);height:auto}
.flavor .fname{font-family:var(--f-display);font-size:clamp(22px,2.8vw,30px)}
.info{
  position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;
  background:var(--bg);border:3px solid var(--line);
  font-family:var(--f-display);font-size:24px;color:var(--brand-deep);display:grid;place-items:center;line-height:1;
}
.info:active{background:var(--line)}

.tray{
  background:var(--panel);border:4px dashed var(--empty-line);border-radius:28px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;padding:16px;min-height:0;
}
.tray-title{font-family:var(--f-display);font-size:clamp(20px,2.4vw,26px);margin:0}
.tray svg{flex:1;width:100%;max-width:240px;min-height:160px;max-height:46vh}
.tray .hint{color:var(--ink-soft);font-size:16px;text-align:center;margin:0}
.slot{cursor:pointer}

.big{
  font-family:var(--f-display);font-size:clamp(22px,2.8vw,30px);
  padding:16px 28px;border-radius:999px;background:var(--brand);color:#fff;box-shadow:0 6px 0 var(--brand-deep);
  transition:transform .1s ease;
}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--brand-deep)}
.big.pay{background:var(--mint);box-shadow:0 6px 0 var(--mint-deep)}
.big.pay:active{box-shadow:0 2px 0 var(--mint-deep)}
.big:disabled{background:#E4D6D1;box-shadow:0 6px 0 #CDBAB3;color:#fff;cursor:default;transform:none}
.tray .big{width:100%}

/* 시작 */
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.start svg{width:min(260px,44vw);height:auto;max-height:46vh}
.start h1{font-family:var(--f-display);font-size:clamp(36px,6vw,64px);margin:0;text-wrap:balance}
.start p{margin:0;font-size:clamp(18px,2.2vw,22px);color:var(--ink-soft)}
.start .big{font-size:clamp(28px,4vw,40px);padding:20px 56px}
.bob{animation:bob 2.4s ease-in-out infinite;transform-origin:center bottom}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* 결제 */
.pay-wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;max-width:960px;width:100%;margin:0 auto;align-items:stretch}
.receipt{background:var(--panel);border:4px solid var(--line);border-radius:28px;padding:20px 24px;display:flex;flex-direction:column;align-items:center;gap:8px}
.receipt svg{width:min(190px,70%);height:auto;max-height:36vh}
.rows{width:100%;display:grid;gap:8px;font-size:clamp(18px,2.1vw,22px);margin:0}
.rows div{display:flex;justify-content:space-between;gap:12px;border-bottom:2px dotted var(--line);padding-bottom:6px}
.rows dt{color:var(--ink-soft)}
.rows dd{margin:0;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;width:100%;font-family:var(--f-display);font-size:clamp(26px,3.2vw,36px);margin-top:6px}
.total span:last-child{color:var(--brand-deep);font-variant-numeric:tabular-nums}
.method{display:flex;flex-direction:column;gap:16px;justify-content:center}
.method h3{font-family:var(--f-display);font-size:clamp(22px,2.6vw,28px);margin:0;text-align:center}
.cardbtn{
  background:var(--panel);border:5px solid var(--mint);border-radius:28px;box-shadow:0 6px 0 var(--mint-deep);
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px;
}
.cardbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mint-deep)}
.cardbtn svg{width:min(170px,60%);height:auto}
.cardbtn span{font-family:var(--f-display);font-size:clamp(26px,3.2vw,34px);color:var(--mint-deep)}
.method p{margin:0;text-align:center;color:var(--ink-soft)}

/* 카드 꽂기 · 결제 중 · 완료 */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.center h2{font-family:var(--f-display);font-size:clamp(32px,5vw,52px);margin:0;text-wrap:balance}
.center p{margin:0;font-size:clamp(18px,2.2vw,24px);color:var(--ink-soft)}
.reader{width:min(300px,60vw);height:auto;max-height:40vh}
.cardmove{animation:insert 1.8s ease-in-out infinite}
.cardswipe{animation:swipe 1.6s ease-in-out infinite}
@keyframes swipe{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}75%,100%{transform:translateY(86px);opacity:1}}
.failtxt{color:var(--brand-deep)}
.center p.failsub{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);color:var(--ink)}
@keyframes insert{0%{transform:translateY(-40px);opacity:0}25%{opacity:1}70%,100%{transform:translateY(46px);opacity:1}}
.spinner{width:96px;height:96px;border-radius:50%;border:12px solid var(--line);border-top-color:var(--mint);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ticket{background:var(--panel);border:4px solid var(--line);border-radius:24px;padding:14px 40px;display:flex;flex-direction:column;align-items:center}
.ticket small{font-size:18px;color:var(--ink-soft)}
.ticket strong{font-family:var(--f-display);font-size:clamp(56px,8vw,88px);font-weight:400;color:var(--brand-deep);line-height:1.05;font-variant-numeric:tabular-nums}
.done-row{display:flex;gap:28px;align-items:center;flex-wrap:wrap;justify-content:center}
.done-row svg{width:min(170px,34vw);height:auto;max-height:34vh}

/* 하단 */
.bottom{
  background:var(--panel);border-top:4px solid var(--line);
  padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.bottom[hidden]{display:none!important}
.nav{font-family:var(--f-display);font-size:clamp(18px,2.2vw,22px);padding:12px 22px;border-radius:999px;background:var(--bg);border:3px solid var(--line)}
.nav:active{background:var(--line)}
.summary{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-display);font-size:clamp(18px,2.2vw,22px)}
.chip{padding:6px 14px;border-radius:999px;background:var(--bg);border:2px solid var(--line)}
.sum-total{color:var(--brand-deep);font-variant-numeric:tabular-nums;margin-left:6px}

/* 맛 설명 팝업 */
.modal{position:fixed;inset:0;background:rgba(58,36,32,.45);display:grid;place-items:center;padding:20px;z-index:20;animation:fade .2s ease}
.sheet{background:var(--panel);border-radius:32px;padding:24px 28px;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;border:5px solid var(--line)}
.sheet svg{width:150px;height:auto}
.sheet h2{font-family:var(--f-display);font-size:40px;margin:0}
.sheet p{margin:0;font-size:clamp(19px,2.4vw,23px);line-height:1.6;max-width:30ch}
.sheet .tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sheet .tags span{font-family:var(--f-display);font-size:18px;padding:5px 14px;border-radius:999px;background:var(--bg);border:2px solid var(--line)}
.sheet .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}

.fs{font-family:var(--f-display);font-size:15px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff}

.take{display:flex;align-items:center;gap:14px;background:#FFF0F5;border:4px solid var(--brand);border-radius:22px;padding:12px 22px;color:var(--brand-deep);text-align:left;animation:pulse 1.6s ease-in-out infinite}
.take svg{width:58px;height:58px;flex:none}
.take span{font-family:var(--f-display);font-size:clamp(22px,2.8vw,30px);color:var(--ink);line-height:1.3}
.take b{font-weight:400;color:var(--brand-deep)}
.take small{display:block;font-family:var(--f-body);font-size:clamp(15px,1.8vw,18px);color:var(--ink-soft)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.note{font-size:16px!important;color:var(--brand-deep)!important;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px}

/* ===== 직원용 화면 ===== */
.staff{height:100%;display:grid;grid-template-rows:auto auto 1fr}
.staff[hidden]{display:none!important}
.app[hidden]{display:none!important}
.badge{font-family:var(--f-display);font-size:.55em;background:#fff;color:var(--brand-deep);padding:3px 12px;border-radius:999px;letter-spacing:0}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hbtn{font-family:var(--f-display);font-size:clamp(17px,2vw,21px);padding:9px 20px;border-radius:999px;background:#fff;color:var(--brand-deep);box-shadow:0 4px 0 var(--brand-deep)}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.hlink{font-family:var(--f-display);font-size:15px;color:#fff;opacity:.9;text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;background:var(--panel);border-bottom:4px solid var(--line);
  padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tab{font-family:var(--f-display);font-size:clamp(18px,2.2vw,23px);padding:10px 22px;border-radius:999px;background:var(--bg);border:3px solid var(--line);display:flex;gap:8px;align-items:center}
.tab .n{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--line);font-size:.85em;font-variant-numeric:tabular-nums}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tab.on .n{background:#fff;color:var(--brand-deep)}
.status{margin-left:auto;align-self:center;color:var(--ink-soft);font-size:15px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mint)}
.dot.off{background:#D9A99A}
.smain{overflow:auto;padding-block:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr));gap:18px;align-items:start}
.order{background:var(--panel);border:4px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.order.flash{animation:flash 1s ease-in-out 3;border-color:var(--brand)}
@keyframes flash{0%,100%{background:var(--panel)}50%{background:#FFE3EC}}
.o-head{display:flex;align-items:center;gap:10px}
.o-pic svg{width:46px;height:auto;max-height:60px;display:block}
.o-head .o-time{margin-left:auto}
.o-line{display:flex;align-items:center;gap:8px 14px;flex-wrap:nowrap;white-space:nowrap;overflow-x:auto;font-family:var(--f-display);font-size:clamp(22px,2.4vw,26px);background:var(--bg);border-radius:16px;padding:10px 14px}
.o-cont{color:var(--brand-deep);white-space:nowrap}
.fl1{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.o-no{font-family:var(--f-display);font-size:clamp(40px,5vw,54px);color:var(--brand-deep);line-height:1;font-variant-numeric:tabular-nums}
.o-time{color:var(--ink-soft);font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
.o-body{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center}
.o-body svg{width:110px;height:auto;max-height:150px}
.o-list{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:clamp(18px,2vw,21px)}
.o-list li{display:flex;gap:8px;align-items:center}
.o-list .k{font-family:var(--f-display);color:var(--ink-soft);min-width:3.2em}
.o-list .v{font-family:var(--f-display);font-size:1.15em}
.sw{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid}
.order .big{width:100%;padding:14px}
.order.old{box-shadow:none;opacity:.92}
.order.old .o-no{color:var(--ink-soft)}
.restore{font-family:var(--f-display);font-size:18px;padding:11px;border-radius:999px;background:var(--bg);border:3px solid var(--line);width:100%}
.restore:active{background:var(--line)}
.empty{text-align:center;color:var(--ink-soft);padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:120px;height:auto;opacity:.6}
.empty h3{font-family:var(--f-display);font-size:28px;color:var(--ink);margin:0}
.empty p{margin:0;font-size:18px;max-width:34ch}
.gate{position:fixed;inset:0;background:rgba(58,36,32,.5);display:grid;place-items:center;padding:20px;z-index:30}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.stat{background:var(--bg);border:3px solid var(--line);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stat small{font-size:16px;color:var(--ink-soft)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,36px);color:var(--brand-deep);font-variant-numeric:tabular-nums}
.stat.wide{grid-column:1/-1}
.fl-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}
.fl{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:17px}
.fl svg{width:56px;height:auto}
.fl b{font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.sheet.wide{max-width:640px}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:6px 0 0;color:var(--ink-soft);font-weight:400}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:17px;z-index:40;max-width:calc(100% - 40px)}

/* 세로 화면·작은 화면 */
@media (max-width:820px){

<script>
/* ===== 바꾸고 싶으면 여기만 고치면 돼요 ===== */
const SHOP_NAME = "냠냠 아이스크림";
const PRICE = 2000;          // 한 스쿱 가격
const MAX_SCOOPS = 2;        // 최대 스쿱 수
const MAX_TICKET = 20;       // 번호표 수 (20번 다음은 다시 1번)
const FAIL_RATE = 0.15;      // 카드를 꽂았을 때 결제 실패 확률 (15%) → 긁어서 다시 결제
const FLAVORS = [
  { id:"choco",  name:"초코",   color:"#7A4A2E", shade:"#5C3520", dots:"#3E2214",
    desc:"진하고 달콤한 초콜릿 맛이에요. 초코칩이 콕콕 들어 있어요.", tags:["달콤해요","갈색"] },
  { id:"berry",  name:"딸기",   color:"#F59AB8", shade:"#E07197", dots:"#D93A62",
    desc:"새콤달콤한 딸기 맛이에요. 빨간 딸기 조각이 쏙쏙 들어 있어요.", tags:["새콤달콤","분홍색"] },
  { id:"yogurt", name:"요거트", color:"#FBFAF4", shade:"#E4E0D2", dots:null,
    desc:"부드럽고 상큼한 요거트 맛이에요.", tags:["상큼해요","하얀색"] },
  { id:"mango",  name:"망고",   color:"#FFC93C", shade:"#F0A91E", dots:null,
    desc:"노랗고 달콤한 망고 맛이에요. 여름 과일 향이 가득해요.", tags:["달콤해요","노란색"] },
  { id:"grape",  name:"포도",   color:"#9C6BC9", shade:"#7C4FAB", dots:"#5E3590",
    desc:"새콤하고 시원한 포도 맛이에요.", tags:["새콤해요","보라색"] },
];
/* ========================================= */

const won = n => n.toLocaleString("ko-KR") + "원";
const $ = s => document.querySelector(s);
const main = $("#main");
const state = { screen:"start", count:0, container:null, coneType:null, scoops:[], swiped:false };
const FLOW = ["start","container","conetype","count","flavor","pay"];

/* ---- 주문 저장 (손님 화면과 직원 화면이 함께 써요) ---- */
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
/* 파일로 열면(로그인 없음) 무료 알림 서비스 ntfy.sh 의 '방'으로 주문을 주고받아요.
   손님 파일과 직원 파일이 같은 ROOM 이름을 써야 해요. */
const RELAY = "https://ntfy.sh";
/* 주소 끝에 ?shop=이름 을 붙이면 그 이름끼리만 주문을 주고받아요 (예: 유치원마다 다르게) */
const SHOP = (new URLSearchParams(location.search).get("shop") || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 32);
const ROOM  = "nyamnyam-icecream-web-b0ae1ac950ca" + (SHOP ? "-" + SHOP : "");
const FILE_MODE = true;
let dbPromise = null;
function getDb(){
  if (FILE_MODE) return Promise.resolve(null);
  if (!dbPromise) dbPromise = (async () => {
    for (let i = 0; i < 30 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
    try { return window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e) { return null; }
  })();
  return dbPromise;
}
function localNo(){
  let n = 1;
  try { // 날짜가 바뀌면 다시 1번부터
    const c = JSON.parse(localStorage.getItem("icecream-order-no2") || "null");
    n = c && c.day === todayKey() ? (c.n % MAX_TICKET) + 1 : 1;
    localStorage.setItem("icecream-order-no2", JSON.stringify({ day: todayKey(), n }));
  } catch(e) {}
  return n;
}
async function relaySend(order){
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(`${RELAY}/${ROOM}`, { method: "POST", body: JSON.stringify(order), signal: ctl.signal });
    clearTimeout(t); return r.ok;
  } catch(e) { return false; }
}
const OUTBOX = "icecream-outbox";
function outboxGet(){ try { return JSON.parse(localStorage.getItem(OUTBOX) || "[]") || []; } catch(e) { return []; } }
function outboxSet(a){ try { localStorage.setItem(OUTBOX, JSON.stringify(a)); } catch(e) {} }
function outboxAdd(o){ const a = outboxGet(); a.push(o); outboxSet(a.slice(-40)); }
let flushing = false;
async function outboxFlush(){
  if (flushing) return; flushing = true;
  try {
    let a = outboxGet().filter(o => o.day === todayKey());
    const left = [];
    for (const o of a) { if (!(await relaySend(o))) left.push(o); }
    outboxSet(left);
  } finally { flushing = false; }
}
if (FILE_MODE) { setInterval(outboxFlush, 10000); window.addEventListener("online", outboxFlush); setTimeout(outboxFlush, 1500); }
async function placeOrder(){
  const order = { day: todayKey(), createdAt: Date.now(), container: state.container, coneType: state.container === "cone" ? (state.coneType || "basic") : null, count: state.count,
                  scoops: state.scoops.slice(0, state.count), total: total(), status: "new", doneAt: null };
  const db = await getDb();
  if (db) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const snap = await db.collection("orders").where("day", "==", order.day).get();
        // 가장 최근 주문 번호의 다음 번호 (20번 다음은 다시 1번)
        let last = null; snap.docs.forEach(d => { const o = d.data(); if (typeof o.no === "number" && (!last || (o.createdAt || 0) > (last.createdAt || 0))) last = o; });
        order.no = last ? (last.no % MAX_TICKET) + 1 : 1;
        await db.collection("orders").doc().set(order);
        return { no: order.no, sent: true };
      } catch(e) {
        if (!e || e.code !== "unavailable") break;
        await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
      }
    }
  }
  if (!db) {
    order.no = localNo();
    order.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    for (let attempt = 0; attempt < 2; attempt++) {
      if (await relaySend(order)) return { no: order.no, sent: true };
      await new Promise(r => setTimeout(r, 700));
    }
    outboxAdd(order);   // 못 보낸 주문은 저장해 두었다가 인터넷이 되면 다시 보내요
    return { no: order.no, sent: false };
  }
  return { no: localNo(), sent: false };
}

/* ---- 소리 (화면을 누른 뒤부터 나요) ---- */
let actx = null;
function beep(freq=660, dur=.09, delay=0, vol=.18){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type="sine"; o.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const ding = () => { beep(880,.15); beep(1175,.25,.15); };
/* 여러 가지 효과음 */
function tone(f, dur, {type="sine", vol=.16, delay=0, to=null}={}){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .03);
  }catch(e){}
}
function noise(dur, {vol=.2, delay=0, from=800, to=3000}={}){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + delay, len = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource(); src.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2; bp.frequency.setValueAtTime(from, t); bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(bp).connect(g).connect(actx.destination); src.start(t); src.stop(t + dur);
  }catch(e){}
}
const sfx = {
  start(){ [523,659,784].forEach((f,i)=>tone(f,.16,{type:"triangle",delay:i*.08})); },        // 주문하기: 도미솔
  select(){ tone(660,.07,{type:"triangle"}); tone(990,.1,{type:"triangle",delay:.06}); },          // 콘·컵·스쿱 수 고르기: 뽁뽁
  scoop(i){ tone(320+i*120,.16,{to:760+i*160,vol:.2}); },                                          // 맛 담기: 퐁(두 번째는 더 높게)
  remove(){ tone(700,.16,{to:280,vol:.16}); },                                                     // 스쿱 빼기: 뿅↓
  full(){ tone(180,.12,{type:"square",vol:.07}); tone(160,.14,{type:"square",vol:.07,delay:.12}); }, // 이미 다 찼어요
  info(){ tone(1047,.22,{type:"triangle",vol:.12}); tone(1319,.3,{type:"triangle",vol:.12,delay:.1}); }, // 맛 설명: 띠링
  close(){ tone(880,.08,{to:660,vol:.1}); },
  back(){ tone(440,.12,{type:"triangle",to:330,vol:.12}); },                                       // 이전·처음으로
  card(){ noise(.05,{vol:.25,from:2000,to:4000}); tone(990,.12,{type:"square",vol:.06,delay:.05}); }, // 카드 결제 버튼
  insert(){ noise(.06,{vol:.3,from:1500,to:3000}); tone(1200,.08,{type:"square",vol:.05,delay:.08}); tone(1200,.08,{type:"square",vol:.05,delay:.2}); }, // 카드 꽂음: 딸깍 삑삑
  processing(sec){ for(let t=0;t<sec;t+=.45) tone(1500,.04,{type:"sine",vol:.06,delay:t}); },        // 결제 중: 똑똑똑
  success(){ [523,659,784,1047].forEach((f,i)=>tone(f,.18,{type:"triangle",vol:.15,delay:i*.1})); [659,784,1047].forEach(f=>tone(f,.5,{type:"triangle",vol:.08,delay:.45})); }, // 결제 완료: 빠밤
  fail(){ tone(440,.2,{type:"square",vol:.08}); tone(311,.38,{type:"square",vol:.08,delay:.24}); }, // 결제 실패: 삐-빅
  swipe(){ noise(.38,{vol:.32,from:500,to:4500}); tone(1320,.1,{type:"square",vol:.05,delay:.42}); }, // 카드 긁음: 쓱-삑
  done(){ tone(988,.12,{type:"triangle"}); tone(1319,.25,{type:"triangle",delay:.1}); },           // 직원 완료: 딩동
  restore(){ tone(660,.14,{type:"triangle",to:440}); },
  sales(){ [784,988,1175].forEach((f,i)=>tone(f,.14,{type:"sine",vol:.1,delay:i*.07})); },
};

/* ---- 그림 (클레이로 만들기 쉽게 단순한 모양) ---- */
const SCOOP_PATH = "M8,56 C8,24 28,6 50,6 C72,6 92,24 92,56 Q88,68 80,61 Q72,71 64,61 Q56,71 48,61 Q40,71 32,61 Q24,71 17,61 Q10,66 8,56 Z";
function scoopG(f, x, y, extra=""){
  const dots = f.dots ? `
    <ellipse cx="36" cy="32" rx="3.6" ry="2.6" fill="${f.dots}" transform="rotate(-20 36 32)"/>
    <ellipse cx="60" cy="24" rx="3.6" ry="2.6" fill="${f.dots}" transform="rotate(25 60 24)"/>
    <ellipse cx="70" cy="44" rx="3.6" ry="2.6" fill="${f.dots}" transform="rotate(-10 70 44)"/>
    <ellipse cx="48" cy="48" rx="3.6" ry="2.6" fill="${f.dots}" transform="rotate(15 48 48)"/>
    <ellipse cx="26" cy="48" rx="3.6" ry="2.6" fill="${f.dots}" transform="rotate(30 26 48)"/>` : "";
  return `<g transform="translate(${x-50} ${y-40})" ${extra}>
    <path d="${SCOOP_PATH}" fill="${f.color}" stroke="${f.shade}" stroke-width="3" stroke-linejoin="round"/>
    ${dots}
    <ellipse cx="32" cy="22" rx="10" ry="6" fill="#fff" opacity=".55" transform="rotate(-25 32 22)"/>
  </g>`;
}
function emptyG(x, y, n, extra=""){
  return `<g transform="translate(${x-50} ${y-40})" ${extra}>
    <path d="${SCOOP_PATH}" fill="var(--empty)" stroke="var(--empty-line)" stroke-width="3" stroke-dasharray="7 6" stroke-linejoin="round"/>
    <text x="50" y="45" text-anchor="middle" font-family="Jua, sans-serif" font-size="26" fill="var(--empty-line)">${n}</text>
  </g>`;
}
const CONES = { basic:{name:"기본 콘", fill:"var(--cone)", line:"var(--cone-line)"}, choco:{name:"초코 콘", fill:"#7A4A2E", line:"#3E2214"} };
const coneSVG = (t="basic") => { const c = CONES[t] || CONES.basic; return `<g>
  <path d="M52,170 L148,170 L100,292 Z" fill="${c.fill}" stroke="${c.line}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M68,170 L118,250 M92,170 L130,225 M116,170 L140,200 M132,170 L82,250 M108,170 L70,225 M84,170 L60,200" stroke="${t==="choco"?"#A87452":c.line}" stroke-width="3" stroke-linecap="round" opacity=".75"/>
</g>`; };
/* 컵: 파란 땡땡이 종이컵 + 냠냠 로고 스티커 */
const CUP_BODY = "M28,186 L172,186 L158,287 Q157,292 151,292 L49,292 Q43,292 42,287 Z";
const cupSVG = () => { let pleat = "", dots = "";
  for (let x = 38; x <= 162; x += 12) pleat += `<line x1="${x}" y1="190" x2="${(100+(x-100)*.78).toFixed(1)}" y2="290"/>`;
  [196,216,236,256,276].forEach((y,r) => { for (let x = 30 + (r%2)*11; x <= 172; x += 22) dots += `<circle cx="${x}" cy="${y}" r="4.6"/>`; });
  return `<g><defs><clipPath id="cupclip"><path d="${CUP_BODY}"/></clipPath></defs>
  <path d="${CUP_BODY}" fill="#6FB6E8"/>
  <g clip-path="url(#cupclip)"><g fill="#fff" opacity=".95">${dots}</g><g stroke="#4F9AD0" stroke-width="1.6" opacity=".55">${pleat}</g></g>
  <path d="${CUP_BODY}" fill="none" stroke="#3E88C0" stroke-width="4" stroke-linejoin="round"/>
  <rect x="22" y="177" width="156" height="15" rx="7.5" fill="#F4FAFF" stroke="#3E88C0" stroke-width="4"/>
  <g transform="translate(64 212)"><rect width="72" height="46" rx="8" fill="#FFF6F1" stroke="#E2477E" stroke-width="3.5"/>
   <g transform="translate(15 23) scale(.11) translate(-100 -170)"><path d="M52,170 L148,170 L100,292 Z" fill="#E3A35B" stroke="#B9763A" stroke-width="10" stroke-linejoin="round"/></g>
   <g transform="translate(15 20) scale(.17) translate(-50 -40)"><path d="${SCOOP_PATH}" fill="#FFC93C" stroke="#F0A91E" stroke-width="6"/></g>
   <g transform="translate(15 12) scale(.17) translate(-50 -40)"><path d="${SCOOP_PATH}" fill="#F59AB8" stroke="#E07197" stroke-width="6"/></g>
   <text x="47" y="24" text-anchor="middle" font-family="Jua, sans-serif" font-size="15" fill="#E2477E">냠냠</text>
   <text x="47" y="36" text-anchor="middle" font-family="Jua, sans-serif" font-size="8" fill="#3A2420">아이스크림</text></g>
</g>`; };
/* 덩이 위치: 콘은 위로 쌓고, 컵은 옆으로 나란히 */
function slotPos(container, count){
  if (!count) return [];
  if (container === "cone") return count === 1 ? [[100,150]] : [[100,152],[100,96]];
  return count === 1 ? [[100,160]] : [[66,162],[134,162]];
}
function treatSVG({container, coneType="basic", count, scoops=[], clickable=false, plain=false}){
  const pos = slotPos(container, count);
  const vb = container === "cone" && count === 2 ? "0 46 200 252" : "0 96 200 202";
  let body = container === "cone" ? "" : cupSVG();
  // 콘은 덩이 뒤에 그려야 하므로 먼저
  if (container === "cone") body = coneSVG(coneType);
  const layers = pos.map(([x,y],i) => {
    const f = FLAVORS.find(v => v.id === scoops[i]);
    const ex = clickable ? `class="slot" data-slot="${i}" role="button" aria-label="${i+1}번 스쿱${f ? " "+f.name+", 누르면 빼요" : " 비어 있음"}"` : "";
    if (f) return scoopG(f, x, y, ex);
    return plain ? scoopG({color:"#F59AB8",shade:"#E07197",dots:null}, x, y) : emptyG(x, y, i+1, ex);
  });
  // 컵: 덩이가 컵 위에 보이도록 덩이 먼저, 컵 테두리는 위에
  if (container === "cup") return `<svg viewBox="${vb}" aria-hidden="${!clickable}">${layers.join("")}${cupSVG()}</svg>`;
  return `<svg viewBox="${vb}" aria-hidden="${!clickable}">${body}${layers.join("")}</svg>`;
}
function flavorSVG(f){ return `<svg viewBox="0 0 100 76" aria-hidden="true">${scoopG(f,50,40)}</svg>`; }

/* ---- 화면 ---- */
const total = () => state.count * PRICE;
const contName = (c, t) => c === "cone" ? (t ? (CONES[t] || CONES.basic).name : "콘") : "컵";

function render(){
  const s = state.screen;
  $("#shopName").innerHTML = `<svg viewBox="0 0 60 76" aria-hidden="true"><path d="M14,36 L46,36 L30,74 Z" fill="#FFD9A0" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><circle cx="30" cy="24" r="18" fill="#fff"/></svg>${SHOP_NAME}`;
  const steps = $("#steps"); steps.hidden = !["count","container","conetype","flavor","pay"].includes(s);
  const idx = FLOW.indexOf(s === "conetype" ? "container" : s);
  steps.querySelectorAll("li").forEach(li => {
    const i = FLOW.indexOf(li.dataset.s);
    li.className = i === idx ? "on" : (i < idx ? "done" : "");
  });
  $("#bottom").hidden = !["count","container","conetype","flavor","pay"].includes(s);
  $("#backBtn").hidden = s === "container";
  const chips = [];
  if (state.container) chips.push(`<span class="chip">${contName(state.container, state.container === "cone" ? state.coneType : null)}</span>`);
  if (state.count) chips.push(`<span class="chip">${state.count}스쿱</span>`);
  state.scoops.filter(Boolean).forEach(id => chips.push(`<span class="chip">${FLAVORS.find(f=>f.id===id).name}</span>`));
  $("#summary").innerHTML = chips.join("") + (state.count ? `<span class="sum-total">${won(total())}</span>` : "");

  main.innerHTML = SCREENS[s]();
  main.scrollTop = 0;
}

const SCREENS = {
  start: () => `<section class="screen"><div class="start">
      <svg class="bob" viewBox="0 46 200 252" aria-hidden="true">${coneSVG()}${scoopG(FLAVORS[1],100,152)}${scoopG(FLAVORS[3],100,96)}</svg>
      <h1>어서 오세요!</h1>
      <p>화면을 눌러 아이스크림을 주문해요</p>

/* ---- 동작 ---- */
let timers = [];
const clearTimers = () => { timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = []; };
function go(screen){ clearTimers(); state.screen = screen; render(); }
function reset(){ state.count=0; state.container=null; state.coneType=null; state.scoops=[]; state.swiped=false; go("start"); }

function pick(id){
  const i = state.scoops.findIndex((v, k) => !v && k < state.count);
  const slot = i === -1 ? (state.scoops.length < state.count ? state.scoops.length : -1) : i;
  if (slot === -1) { sfx.full(); return; }       // 이미 다 채움
  state.scoops[slot] = id; sfx.scoop(slot);
  render();
}

function openInfo(id){
  const f = FLAVORS.find(v => v.id === id);
  const canPick = state.scoops.filter(Boolean).length < state.count;
  $("#modalRoot").innerHTML = `<div class="modal" data-act="close" role="dialog" aria-modal="true" aria-label="${f.name} 맛 설명">
    <div class="sheet">
      ${flavorSVG(f)}
      <h2>${f.name}</h2>
      <p>${f.desc}</p>
      <div class="tags">${f.tags.map(t=>`<span>${t}</span>`).join("")}</div>
      <div class="btns">
        <button class="nav" type="button" data-act="close">닫기</button>
        ${canPick ? `<button class="big" type="button" data-act="pickClose" data-v="${f.id}">이 맛 고르기</button>` : ""}
      </div>
    </div></div>`;
  sfx.info();
}
const closeInfo = () => { $("#modalRoot").innerHTML = ""; };

document.addEventListener("click", e => {
  if (MODE === "staff") return;
  const slot = e.target.closest(".slot");
  if (slot && state.screen === "flavor") {
    const i = +slot.dataset.slot;
    if (state.scoops[i]) { state.scoops[i] = null; sfx.remove(); render(); }
    return;
  }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === "close" && e.target !== el && el.classList.contains("modal")) return; // 팝업 안쪽 누름
  switch (act) {
    case "begin": sfx.start(); go("container"); break;
    case "count":
      sfx.select(); if (state.count !== +v) { state.count = +v; state.scoops = []; }
      go("flavor"); break;
    case "container": sfx.select(); state.container = v;
      if (v === "cone") go("conetype"); else { state.coneType = null; go("count"); }
      break;
    case "conetype": sfx.select(); state.coneType = v; go("count"); break;
    case "info": e.stopPropagation(); openInfo(v); break;
    case "pick": pick(v); break;
    case "close": sfx.close(); closeInfo(); break;
    case "pickClose": closeInfo(); pick(v); break;
    case "toPay": sfx.select(); go("pay"); break;
    case "card": sfx.card(); state.swiped = false; go("insert"); break;
    case "cancelPay": sfx.back(); state.swiped = false; go("pay"); break;
    case "inserted": sfx.insert(); startPaying(false); break;
    case "swiped": sfx.swipe(); state.swiped = true; startPaying(true); break;
    case "home": sfx.back(); reset(); break;
  }
});
/* 결제: 카드를 꽂으면 15% 확률로 실패 → 옆에 긁으면 결제돼요 */
function startPaying(bySwipe){
  const willFail = !bySwipe && Math.random() < FAIL_RATE;
  go("paying"); sfx.processing(2.4);   // go()가 타이머를 지우므로 화면을 먼저 바꾸고 기다려요
  const wait = new Promise(r => timers.push(setTimeout(r, 2700)));
  if (willFail) { wait.then(() => { if (state.screen !== "paying") return; go("fail"); sfx.fail(); }); return; }
  Promise.all([placeOrder(), wait]).then(([res]) => {
        if (state.screen !== "paying") return;
        state.lastNo = res.no; state.sent = res.sent;
        go("done"); sfx.success();
        let n = 15; const cd = () => { const s = $("#cd"); if (s) s.textContent = `(${n})`; };
        cd();
        timers.push(setInterval(() => { n--; cd(); if (n <= 0) reset(); }, 1000));
  });
}
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".flavor")) { e.preventDefault(); pick(e.target.dataset.v); }
  if (e.key === "Escape") closeInfo();
});
$("#homeBtn").addEventListener("click", () => { sfx.back(); reset(); });
$("#backBtn").addEventListener("click", () => {
  sfx.back();
  const prev = { conetype:"container", count: state.container === "cone" ? "conetype" : "container", flavor:"count", pay:"flavor" }[state.screen];
  if (prev) go(prev);
});

/* 전체 화면 (지원되는 기기에서만 보여요) */
const root = document.documentElement;
const reqFS = root.requestFullscreen || root.webkitRequestFullscreen;
function toggleFS(b){
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const p = reqFS.call(root); if (p && p.catch) p.catch(()=>{ b.hidden = true; }); }
  } catch(e) { b.hidden = true; }
}
if (reqFS) {
  const b = $("#fsBtn"); b.hidden = false; b.addEventListener("click", () => toggleFS(b));
  $("#fsBtn2").hidden = false;
}

/* ================= 직원용 화면 (#staff) ================= */
const staff = { orders: [], tab: "new", started: false, ready: false, err: null, flash: new Set(), busy: new Set(), unsub: null, day: null, loadedAt: Date.now() };
const fmtTime = ms => { const d = new Date(ms); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const flavorOf = id => FLAVORS.find(f => f.id === id);

function orderSound(){
  // 약 3초: 띵동댕 두 번 + 마지막 긴 음
  [[784,0],[988,.2],[1175,.4],[784,1],[988,1.2],[1175,1.4]].forEach(([f,t]) => beep(f,.5,t,.3));
  beep(1568,1,2,.3);
}
function toast(msg){
  $("#toastRoot").innerHTML = `<div class="toast" role="status">${msg}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { $("#toastRoot").innerHTML = ""; }, 3500);
}

function subscribeToday(db){
  if (staff.unsub) staff.unsub();
  staff.day = todayKey(); staff.ready = false;
  const timer = setTimeout(() => { if (!staff.ready) { staff.err = "slow"; renderStaff(); } }, 10000);
  staff.unsub = db.collection("orders").where("day", "==", staff.day).onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); if (staff.err === "slow") staff.err = null; }
    const fresh = snap.docChanges()
      .filter(c => c.type === "added" && c.doc.data().status === "new" && (c.doc.data().createdAt || 0) > staff.loadedAt - 10000)
      .map(c => c.doc.id);
    if (fresh.length) {
      fresh.forEach(id => staff.flash.add(id));
      if (staff.started) orderSound();
      setTimeout(() => { fresh.forEach(id => staff.flash.delete(id)); renderStaff(); }, 3000);
    }
    staff.ready = true;
    staff.orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStaff();
  }, () => { clearTimeout(timer); staff.err = "fail"; renderStaff(); });
}

/* ---- 파일 모드: ntfy.sh 로 주문 받기, 직원 아이패드에 저장 ---- */
const SKEY = "icecream-staff-orders";
let relaySaved = {};
function relayLoad(){ try { relaySaved = JSON.parse(localStorage.getItem(SKEY) || "{}") || {}; } catch(e) { relaySaved = {}; } }
function relayStore(){ try { localStorage.setItem(SKEY, JSON.stringify(relaySaved)); } catch(e) {} }
function relayRefresh(){
  const day = todayKey();
  // 지난 날 주문은 지우기 (하루 단위 초기화)
  Object.keys(relaySaved).forEach(k => { if (relaySaved[k].day !== day) delete relaySaved[k]; });
  relayStore();
  staff.orders = Object.values(relaySaved);
}
function relayReceive(raw){
  if (!raw || typeof raw !== "object") return;
  const count = Math.max(1, Math.min(MAX_SCOOPS, Math.floor(Number(raw.count)) || 0));
  const container = raw.container === "cone" ? "cone" : raw.container === "cup" ? "cup" : null;
  const scoops = Array.isArray(raw.scoops) ? raw.scoops.slice(0, count).filter(x => FLAVORS.some(f => f.id === x)) : [];
  const no = Math.floor(Number(raw.no)); const id = String(raw.id || "").slice(0, 40);
  if (!id || !container || scoops.length !== count || !(no > 0) || relaySaved[id]) return;
  const o = { id, no, count, container, coneType: container === "cone" ? (raw.coneType === "choco" ? "choco" : "basic") : null,
              scoops, day: String(raw.day || "").slice(0, 10), createdAt: Number(raw.createdAt) || Date.now(),
              total: count * PRICE, status: "new", doneAt: null };
  if (o.day !== todayKey()) return;
  relaySaved[id] = o; relayStore(); relayRefresh();
  if (o.createdAt > staff.loadedAt - 60000) {
    staff.flash.add(id);
    if (staff.started) orderSound();
    setTimeout(() => { staff.flash.delete(id); renderStaff(); }, 3000);
  }
  renderStaff();
}
let es = null;
function relayConnect(){
  if (es) es.close();
  staff.ready = false;
  try { es = new EventSource(`${RELAY}/${ROOM}/sse?since=12h`); }
  catch(e) { staff.err = "fail"; renderStaff(); return; }
  es.onopen = () => { staff.ready = true; staff.err = null; renderStaff(); };
  es.onerror = () => { staff.ready = false; staff.err = "slow"; renderStaff(); };
  es.onmessage = ev => { try { const m = JSON.parse(ev.data); if (m.event && m.event !== "message") return; relayReceive(JSON.parse(m.message)); } catch(e) {} };
}
/* 실시간 연결이 끊겨도 주문을 놓치지 않도록 주기적으로 한 번 더 확인해요 */
let lastPoll = 0;
async function relayPoll(){
  const open = es && es.readyState === 1;
  if (Date.now() - lastPoll < (open ? 60000 : 15000)) return;
  lastPoll = Date.now();
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(`${RELAY}/${ROOM}/json?poll=1&since=12h`, { signal: ctl.signal });
    clearTimeout(t);
    if (!r.ok) return;
    const txt = await r.text();
    txt.split("\n").forEach(line => { if (!line.trim()) return; try { const m = JSON.parse(line); if (m.event && m.event !== "message") return; relayReceive(JSON.parse(m.message)); } catch(e) {} });
    if (!open) { staff.ready = true; staff.err = null; renderStaff(); }
  } catch(e) {}
}
function bootRelay(){
  staff.relay = true;
  relayLoad(); relayRefresh(); renderStaff(); relayConnect();
  setInterval(relayPoll, 5000); setTimeout(relayPoll, 1500);
  let day = todayKey();
  setInterval(() => { if (todayKey() !== day) { day = todayKey(); relayRefresh(); renderStaff(); } }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (!es || es.readyState === 2)) relayConnect(); });
}

let staffBooted = false;
async function bootStaff(){
  if (staffBooted) return; staffBooted = true;
  renderStaff();
  const db = await getDb();
  if (!db) { bootRelay(); return; }
  subscribeToday(db);
  setInterval(() => { if (todayKey() !== staff.day) { staff.loadedAt = Date.now(); subscribeToday(db); } }, 60000);
}

function orderCard(o, old){
  const scoops = (o.scoops || []).slice(0, o.count);
  const svg = treatSVG({ container: o.container, coneType: o.coneType || "basic", count: o.count, scoops });
  const rows = scoops.map((id, i) => { const f = flavorOf(id) || { name: "?", color: "#ddd", shade: "#bbb" };
    return `<li><span class="k">${i+1}번</span><span class="sw" style="background:${f.color};border-color:${f.shade}"></span><span class="v">${f.name}</span></li>`; }).join("");
  const busy = staff.busy.has(o.id) ? "disabled" : "";
  const line = scoops.map(id => { const f = flavorOf(id) || { name: "?", color: "#ddd", shade: "#bbb" };
    return `<span class="fl1"><span class="sw" style="background:${f.color};border-color:${f.shade}"></span>${f.name}</span>`; }).join("");
  return `<article class="order ${old ? "old" : ""} ${staff.flash.has(o.id) ? "flash" : ""}">
    <div class="o-head"><span class="o-pic">${svg}</span><span class="o-no">${o.no}번</span>
      <span class="o-time">주문 ${fmtTime(o.createdAt)}${old && o.doneAt ? `<br>완료 ${fmtTime(o.doneAt)}` : ""}</span></div>
    <div class="o-line"><span class="o-cont">${contName(o.container, o.container === "cone" ? (o.coneType || "basic") : null)} ${o.count}스쿱</span>${line}</div>
    ${old ? `<button class="restore" type="button" data-sact="restore" data-id="${o.id}" ${busy}>다시 준비 중으로</button>`
          : `<button class="big pay" type="button" data-sact="done" data-id="${o.id}" ${busy}>완료</button>`}
  </article>`;
}

function renderStaff(){
  $("#staffShop").innerHTML = `${$("#shopName").innerHTML}<span class="badge">직원용</span>`;
  const news = staff.orders.filter(o => o.status !== "done").sort((a,b) => a.createdAt - b.createdAt);
  const dones = staff.orders.filter(o => o.status === "done").sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
  const live = staff.ready && !staff.err;
  $("#staffTabs").innerHTML = `
    <button class="tab ${staff.tab==="new"?"on":""}" type="button" data-sact="tab" data-v="new">들어온 주문 <span class="n">${news.length}</span></button>
    <button class="tab ${staff.tab==="done"?"on":""}" type="button" data-sact="tab" data-v="done">완료한 주문 <span class="n">${dones.length}</span></button>
    <span class="status"><span class="dot ${live ? "" : "off"}"></span>${
      staff.err === "none" ? "주문을 받을 수 없어요" : staff.err === "fail" ? "연결이 끊겼어요. 새로고침해 주세요" :
      staff.err === "slow" ? (staff.relay ? "다시 연결하는 중… 인터넷을 확인해 주세요" : "주문 목록을 아직 못 불러왔어요") : staff.ready ? "주문 받는 중" : "불러오는 중"}</span>`;

  const list = staff.tab === "new" ? news : dones;
  let html;
  if (staff.err === "none") {
    html = emptyBox("주문을 받을 수 없어요", "Claude에 로그인한 상태에서 이 페이지를 열어야 손님 화면의 주문이 여기로 들어와요.");
  } else if (!list.length) {
    html = staff.tab === "new"
      ? emptyBox(staff.ready ? "기다리는 주문이 없어요" : "주문을 불러오고 있어요", "손님 화면에서 결제가 끝나면 소리와 함께 여기에 나타나요.")
      : emptyBox("오늘 완료한 주문이 없어요", "들어온 주문에서 완료를 누르면 여기로 옮겨져요.");
  } else {
    html = `<div class="orders">${list.map(o => orderCard(o, staff.tab === "done")).join("")}</div>`;
  }
  $("#staffMain").innerHTML = html;
  if (!staff.started && MODE === "staff" && !$("#modalRoot .gate")) {
    $("#modalRoot").innerHTML = `<div class="gate"><div class="sheet">
      <svg viewBox="0 46 200 252" aria-hidden="true">${coneSVG()}${scoopG(FLAVORS[0],100,152)}${scoopG(FLAVORS[4],100,96)}</svg>
      <h2>주문 받기</h2><p>버튼을 누르면 주문이 들어올 때 알림 소리가 나요. 아이패드 소리를 켜 두세요.</p>
      <button class="big pay" type="button" data-sact="start">주문 받기 시작</button></div></div>`;
  }
}
const emptyBox = (h, p) => `<div class="empty">
  <svg viewBox="0 96 200 202" aria-hidden="true">${cupSVG()}</svg><h3>${h}</h3><p>${p}</p></div>`;

function openSales(){
  const os = staff.orders;
  const money = os.reduce((s,o) => s + (o.total || 0), 0);
  const scoops = os.reduce((s,o) => s + (o.count || 0), 0);
  const byF = {}; os.forEach(o => (o.scoops || []).slice(0, o.count).forEach(id => { byF[id] = (byF[id] || 0) + 1; }));
  const cones = os.filter(o => o.container === "cone").length, cups = os.length - cones;
  const chocoCones = os.filter(o => o.container === "cone" && o.coneType === "choco").length, basicCones = cones - chocoCones;
  const d = new Date();
  $("#modalRoot").innerHTML = `<div class="modal" data-sact="closeSales" role="dialog" aria-modal="true" aria-label="오늘 매출">
    <div class="sheet wide">
      <h2>오늘 매출</h2>
      <p>${d.getMonth()+1}월 ${d.getDate()}일 · 결제가 끝난 주문 기준</p>
      <div class="stats">
        <div class="stat wide"><small>판 금액</small><b>${won(money)}</b></div>
        <div class="stat"><small>판 스쿱 수</small><b>${scoops}스쿱</b></div>
        <div class="stat"><small>주문</small><b>${os.length}건</b></div>
        <div class="stat"><small>기본콘 / 초코콘 / 컵</small><b>${basicCones} / ${chocoCones} / ${cups}</b></div>
      </div>
      <h3>맛별 스쿱 수</h3>
      <div class="fl-row">${FLAVORS.map(f => `<div class="fl">${flavorSVG(f)}<span>${f.name}</span><b>${byF[f.id] || 0}</b></div>`).join("")}</div>
      <div class="btns"><button class="nav" type="button" data-sact="closeSales">닫기</button></div>
    </div></div>`;
}

async function setStatus(id, done){
  if (staff.relay) {
    const o = relaySaved[id]; if (!o) return;
    o.status = done ? "done" : "new"; o.doneAt = done ? Date.now() : null;
    relayStore(); relayRefresh(); done ? sfx.done() : sfx.restore(); renderStaff(); return;
  }
  const db = await getDb(); if (!db) return;
  staff.busy.add(id); renderStaff();
  try { await db.doc("orders/" + id).update(done ? { status: "done", doneAt: Date.now() } : { status: "new", doneAt: null }); done ? sfx.done() : sfx.restore(); }
  catch(e) { toast(e && e.code === "invalid_argument" ? "이 계정으로는 주문을 바꿀 수 없어요." : "저장하지 못했어요. 다시 눌러 주세요."); }
  staff.busy.delete(id); renderStaff();
}

document.addEventListener("click", e => {
  if (MODE !== "staff") return;
  const el = e.target.closest("[data-sact]"); if (!el) return;
  const a = el.dataset.sact;
  if (a === "closeSales" && el.classList.contains("modal") && e.target !== el) return;
  switch (a) {
    case "start": staff.started = true; $("#modalRoot").innerHTML = ""; sfx.start(); break;
    case "tab": staff.tab = el.dataset.v; renderStaff(); break;
    case "done": setStatus(el.dataset.id, true); break;
    case "restore": setStatus(el.dataset.id, false); staff.tab = "new"; break;
    case "sales": sfx.sales(); openSales(); break;
    case "closeSales": $("#modalRoot").innerHTML = ""; break;
    case "fs": toggleFS(el); break;
  }
});

/* ---- 화면 고르기: 주소 끝이 #staff 이면 직원용 ---- */
let MODE = "kiosk";
const FORCE_MODE = "staff";
function route(){
  MODE = FORCE_MODE || (location.hash === "#staff" ? "staff" : "kiosk");
  $(".app").hidden = MODE === "staff";
  $("#staffApp").hidden = MODE !== "staff";
  $("#modalRoot").innerHTML = "";
  if (MODE === "staff") bootStaff(); else { getDb(); render(); }
}
window.addEventListener("hashchange", route);
/* 화면 꺼짐 방지 (가능할 때만) */
async function wake(){ try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch(e) {} }
document.addEventListener("click", wake, { once:true });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });

try { render(); } catch(e) { window.__showErr && window.__showErr("render: " + e.message); }
try { route(); } catch(e) { window.__showErr && window.__showErr("route: " + e.message); }
</script>

</body></html>
